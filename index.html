<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3F687E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RD Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RD Studio do Sono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de celular — faixa azul da marca no topo, cartões empilhados, abas fixas embaixo; a gerência abre mais larga no computador.
   Cores da Studio do Sono: azul petróleo #3F687E do logo, branco e neutros puxados para o azul. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface2:#F5F8FA; --line:#DCE4E9;
  --ink:#14232C; --muted:#4A5A64;
  --accent:#3F687E; --accent-ink:#FFFFFF; --accent-soft:#E2ECF1; --accent-strong:#2E5063;
  --good:#23735A; --warn:#B45309; --warn-bg:#FFF7ED; --warn-line:#FDBA74; --warn-ink:#9A3412;
  --header:#3F687E; --header-ink:#FFFFFF; --header-muted:#D6E4EC; --header-chip:rgba(8,24,32,.28);
  --track:#E1E8EC; --pace:#14232C; --bar-past:#A9C4D3; --shadow:0 6px 20px rgba(20,35,44,.10); --scrim:rgba(10,20,26,.55);
  --line-strong:#7D8F9A; --mid:#3F687E; --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --font:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D161C; --surface:#15212A; --surface2:#1B2A34; --line:#28394A; --ink:#E6EEF2; --muted:#9FB2BE;
  --accent:#8FB8CF; --accent-ink:#0D161C; --accent-soft:#1E3442; --accent-strong:#CFE2EC;
  --good:#7FCBA8; --line-strong:#5E7686; --mid:#8FB8CF; --warn:#F5A35C; --warn-bg:#2A1E12; --warn-line:#6B4423; --warn-ink:#F8C08A;
  --header:#3F687E; --header-ink:#FFFFFF; --header-muted:#D6E4EC; --header-chip:rgba(8,24,32,.28);
  --track:#28394A; --pace:#E6EEF2; --bar-past:#4D6F83; --shadow:0 6px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D161C; --surface:#15212A; --surface2:#1B2A34; --line:#28394A; --ink:#E6EEF2; --muted:#9FB2BE;
  --accent:#8FB8CF; --accent-ink:#0D161C; --accent-soft:#1E3442; --accent-strong:#CFE2EC;
  --good:#7FCBA8; --line-strong:#5E7686; --mid:#8FB8CF; --warn:#F5A35C; --warn-bg:#2A1E12; --warn-line:#6B4423; --warn-ink:#F8C08A;
  --header:#3F687E; --header-ink:#FFFFFF; --header-muted:#D6E4EC; --header-chip:rgba(8,24,32,.28);
  --track:#28394A; --pace:#E6EEF2; --bar-past:#4D6F83; --shadow:0 6px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65); color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{--w:520px}
#app.wide{--w:1120px}
.band{background:var(--header);color:var(--header-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 58px}
.band-in{max-width:var(--w);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.band .eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--header-muted)}
.band h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.band .sub{font-size:14px;color:var(--header-muted)}
.band .chip{align-self:flex-start;background:var(--header-chip);color:var(--header-ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:50%;flex:none;display:block}
.logo-full{width:132px;height:132px;align-self:center;display:block}
.linkbtn{background:var(--header-chip);border:none;color:var(--header-ink);border-radius:10px;min-height:38px;min-width:38px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.linkbtn:disabled{opacity:.4;cursor:not-allowed}
.mnav{display:flex;align-items:center;gap:10px;align-self:flex-start}
.mnav strong{min-width:130px;text-align:center}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.main-in{max-width:var(--w);margin:-42px auto 0;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{border-color:transparent}
.card.flush{padding:0;gap:0;overflow:hidden}
.card.flush>.head{padding:16px 16px 8px}
h2{margin:0;font-size:17px;font-weight:700}
p{margin:0}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.mid{font-size:20px;font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.start{justify-content:flex-start;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.c-good{color:var(--good)} .c-warn{color:var(--warn)} .c-muted{color:var(--muted)}
.bar{position:relative;height:10px;background:var(--track);border-radius:999px}
.bar.thin{height:8px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--good)}
.bar>i.warn{background:var(--warn)}
.bar>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--pace);border-radius:1px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-size:19px;font-weight:800;overflow-wrap:anywhere}
.tag-ok{font-size:12px;font-weight:700;color:var(--good)}
.tag-bad{font-size:12px;font-weight:700;color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px}
.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;padding:0 16px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%;min-height:54px;font-size:17px}
.btn.danger{border-color:var(--warn-line);color:var(--warn-ink);background:var(--warn-bg)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sq{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--accent-strong);font-size:22px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sq.fill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sq:disabled{opacity:.4;cursor:not-allowed}
.stepline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper input.n{width:58px;height:44px;text-align:center;font-size:18px;font-weight:800;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.money{display:flex;align-items:center;gap:8px;border:1.5px solid var(--accent);border-radius:12px;padding:0 14px;min-height:54px;background:var(--surface)}
.money span{font-size:18px;font-weight:700;color:var(--muted)}
.money input{border:none;outline:none;background:transparent;font-size:24px;font-weight:800;width:100%;min-width:0;color:var(--ink)}
.money.sm{min-height:48px;border-width:1.5px;border-color:var(--line)} .money.sm input{font-size:17px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:17px;font-weight:700;background:var(--surface);color:var(--ink);width:100%}
.field textarea{font-weight:500;resize:vertical}
.field .hint{font-weight:500;font-size:12px;color:var(--muted)}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.grp>summary{list-style:none;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;cursor:pointer}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .chev{transition:transform .15s}
details.grp[open]>summary .chev{transform:rotate(180deg)}
details.grp .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.alert{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;color:var(--warn-ink);font-size:13px}
.alert strong{font-size:14px}
.note{background:var(--accent-soft);border-radius:14px;padding:12px 14px;color:var(--accent-strong);font-size:13px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.note svg{flex:none;margin-top:1px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent-strong)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.chip.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;text-align:left;padding:10px 12px;white-space:nowrap}
table.t td{padding:12px;border-top:1px solid var(--line);white-space:nowrap}
table.t td.wrap{white-space:normal;min-width:160px}
table.t .r{text-align:right}
table.t tr.click{cursor:pointer}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line)}
.chart i{flex:1 1 0;border-radius:3px 3px 0 0;background:var(--good);min-height:2px}
.chart i.past{background:var(--bar-past)}
.chart i.zero{background:var(--track)}
.chart i.future{background:transparent;border:1px dashed var(--line);border-bottom:none}
.prod{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) 3.4rem;align-items:center;gap:10px;font-size:13px}
.prod .p{font-weight:800;text-align:right}
.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:72px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.choice .t{font-size:16px;font-weight:800}
.choice .go{margin-left:auto;color:var(--muted)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.add{border-style:dashed}
.who{font-size:26px;font-weight:800;text-align:center;line-height:1.25;text-wrap:balance}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.diff{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:var(--w);margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tab{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent-strong)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:70;width:max-content;max-width:min(440px,calc(100% - 32px));text-align:center;font-size:14px;line-height:1.4}
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px}
.mbody{display:flex;flex-direction:column;gap:12px;font-size:15px}
.mact{display:flex;flex-wrap:wrap-reverse;gap:10px;justify-content:flex-end}
.mact .btn{flex:1 1 160px}
.merr{color:var(--warn-ink);font-weight:700;font-size:14px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px;padding-bottom:22px}}
.split{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.split>.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px}
.split>.side{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px}
.center{text-align:center;align-items:center}
@media (max-width:420px){.big{font-size:28px}.kpi .v{font-size:17px}.tiles .mid{font-size:16px}.who{font-size:23px}}


/* ---------- celular: tirar a cara de site ---------- */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none}
button,a,summary,.tab,.pill,.choice,.chip,[data-act]{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::selection{background:var(--accent-soft);color:var(--ink)}
@media (hover:hover) and (pointer:fine){
  .choice:hover{border-color:var(--accent)}
  table.t tr.click:hover td{background:var(--surface2)}
  .btn:hover{border-color:var(--line-strong)}
  .btn.primary:hover{filter:brightness(1.06)}
  .pill:hover{border-color:var(--line-strong)}
}
/* toque: o botão afunda na hora em que o dedo encosta */
.btn,.sq,.pill,.choice,.linkbtn,.tab{transition:transform 120ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
.btn:active,.sq:active,.pill:active,.linkbtn:active{transform:scale(.97)}
.choice:active{transform:scale(.985)}
.tab:active{transform:scale(.94)}
.btn:disabled:active,.sq:disabled:active{transform:none}
/* alvos de toque com 44px no mínimo */
.linkbtn{min-height:44px;min-width:44px}
.btn.small{min-height:44px}
.pill{min-height:44px}
/* campos: borda visível, foco claro, texto de exemplo mais leve */
.field input,.field select,.field textarea,.stepper input.n{border-color:var(--line-strong)}
.field input:focus,.field select:focus,.field textarea:focus,.stepper input.n:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
::placeholder{color:var(--muted);font-weight:500;opacity:1}
label.money{cursor:text}
.money input{height:100%;min-height:50px}
.money:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.money.sm{border-color:var(--line-strong)}
.field .money input{border:0;padding:0;min-height:44px;background:transparent;font-size:17px}
/* status em três níveis: no ritmo (verde), perto (azul da marca), longe (laranja) */
.c-mid{color:var(--mid)}
.bar>i.mid{background:var(--mid)}
/* indicadores como texto, não como caixinhas */
.kpis{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 4px;gap:0}
.kpis .kpi{background:none;border:0;border-radius:0;padding:0 12px}
.kpis .kpi+.kpi{box-shadow:inset 1px 0 0 var(--line)}
.kpis.loose{background:none;border:0;padding:0;gap:8px}
.kpis.loose .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:none}
/* informação neutra (não é alerta) */
.info{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink)}
.info strong{font-size:14px}
.soft{background:var(--accent-soft);color:var(--accent-strong);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
/* listas no lugar de tabelas no celular */
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:64px}
.lrow .stack{gap:2px}
button.lrow{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.only-narrow{display:none}
@media (max-width:719px){.only-wide{display:none!important}.only-narrow{display:flex}}
/* tabelas largas: primeira coluna fica parada ao arrastar */
.scroll table.t th:first-child,.scroll table.t td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.scroll table.t th:first-child{background:var(--surface2)}
.scroll table.t td:first-child{box-shadow:inset -1px 0 0 var(--line)}
.drag-hint{font-size:12px;color:var(--muted);padding:0 16px 10px}
@media (min-width:720px){.drag-hint{display:none}}
/* janelas de aviso: sobem de baixo, rápido */
.sheet{max-height:92vh;max-height:92dvh;overscroll-behavior:contain;animation:sheetIn 280ms var(--ease-drawer)}
.overlay{animation:fadeIn 200ms ease-out}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{animation:toastIn 220ms var(--ease-out)}
@keyframes toastIn{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
/* gerência no computador: abas no topo, sem barra de celular esticada */
.toptabs{display:none}
@media (min-width:960px){
  #app.wide nav.tabs{display:none}
  #app.wide main{padding-bottom:48px}
  #app.wide .toptabs{display:flex;gap:4px;margin-top:6px}
  .toptabs .tt{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:transparent;color:var(--header-muted);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .toptabs .tt[aria-current="page"]{background:var(--header-chip);color:var(--header-ink)}
}
.band h1.inline{font-size:21px}
.brand h1{margin:0}
@media (prefers-reduced-motion: reduce){
  .sheet{animation:fadeIn 160ms ease-out}
  .toast{animation:none}
  .btn:active,.sq:active,.pill:active,.linkbtn:active,.choice:active,.tab:active{transform:none}
  details.grp>summary .chev{transition:none}
}
.lrow .btn,.lrow>.chip{flex:none;white-space:nowrap}
.lrow .stack{min-width:0}
.lrow .stack>.chip{align-self:flex-start}
.netbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 14px;font-size:13px}
.netbar span{flex:1;min-width:0}
.netbar .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35);flex:none}
:root[data-theme="dark"] .netbar .btn{border-color:rgba(0,0,0,.3)}
.chip.wait{background:var(--surface2);color:var(--ink);border:1px dashed var(--line-strong)}

/* ================= VISUAL MODERNO (v5) ================= */
:root{--bg:#EDF1F4;--line:#E2E8EC;--radius:22px;
  --shadow-sm:0 1px 2px rgba(20,35,44,.05),0 4px 14px rgba(20,35,44,.06);
  --shadow-md:0 2px 4px rgba(20,35,44,.06),0 14px 32px rgba(20,35,44,.12);
  --feature:#24495B;--card-border:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1419;--card-border:#22323D;--shadow-sm:none;--shadow-md:0 14px 32px rgba(0,0,0,.4);--feature:#1C3A49}}
:root[data-theme="dark"]{--bg:#0B1419;--card-border:#22323D;--shadow-sm:none;--shadow-md:0 14px 32px rgba(0,0,0,.4);--feature:#1C3A49}
body{font-size:15px;letter-spacing:-.005em}
/* topo */
.band{padding-block:14px 70px}
.band-in{gap:10px}
.band h1.inline{font-size:22px;letter-spacing:-.02em}
.band .sub{font-size:13px;line-height:1.45}
.mark{width:38px;height:38px;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.linkbtn{background:rgba(255,255,255,.14);border-radius:14px;min-height:42px;min-width:42px}
.main-in{margin-top:-52px;gap:14px}
/* cartões */
.card,details.grp,.kpi,.choice{border-color:var(--card-border);box-shadow:var(--shadow-sm)}
.card{border-radius:var(--radius);padding:18px;gap:14px}
details.grp{border-radius:var(--radius)}
details.grp>summary{min-height:64px;padding:14px 18px}
details.grp .inner{padding:0 18px 18px}
.card.hero{box-shadow:var(--shadow-md)}
h2{font-size:18px;letter-spacing:-.01em}
.label{font-size:13px;font-weight:600}
.big{font-size:38px;letter-spacing:-.035em;line-height:1.05}
.mid{font-size:22px;letter-spacing:-.02em}
/* cartão de destaque (estilo saldo de banco) */
.feature{--ink:#fff;--muted:rgba(255,255,255,.72);--good:#86E0B8;--warn:#FFB677;--mid:#CFE2EC;--track:rgba(255,255,255,.18);--pace:#fff;--line:rgba(255,255,255,.16);--surface2:rgba(255,255,255,.1);--accent-soft:rgba(255,255,255,.14);--accent-strong:#fff;--warn-bg:rgba(255,182,119,.16);--warn-line:rgba(255,182,119,.5);--warn-ink:#FFD2AA;
  background:var(--feature)!important;color:#fff;border-color:transparent!important;position:relative;overflow:hidden}
.feature::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(143,184,207,.28),transparent);pointer-events:none}
.feature>*{position:relative;z-index:1}
.feature .label{color:rgba(255,255,255,.78)}
.feature .bar{height:12px}
.feature .chip.mute,.feature .chip.ok{background:rgba(255,255,255,.14);color:#fff;border-color:transparent}
.kpi.feature{grid-column:1/-1;padding:18px;border-radius:var(--radius);gap:6px}
.kpi.feature .v{font-size:34px;letter-spacing:-.03em}
.kpis.loose .kpi{border-radius:18px;padding:14px;border-color:var(--card-border);box-shadow:var(--shadow-sm)}
.kpis.loose .kpi .v{font-size:21px}
.kpis{border-color:var(--card-border);box-shadow:var(--shadow-sm);border-radius:20px}
/* botões */
.btn{border-radius:14px;min-height:48px}
.btn.block{min-height:58px;border-radius:18px;font-size:17px;letter-spacing:-.01em}
.btn.primary{box-shadow:0 6px 16px rgba(63,104,126,.28)}
.btn.primary:disabled{box-shadow:none}
/* contadores − 0 + em pílula */
.stepline{padding:10px 18px}
.stepper{background:var(--surface2);border-radius:999px;padding:4px;gap:2px}
.stepper .sq{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 1px 2px rgba(20,35,44,.1)}
.stepper .sq.fill{background:var(--accent);box-shadow:0 3px 8px rgba(63,104,126,.3)}
.stepper input.n,.stepper input.n:focus{width:50px;border:0;background:transparent;font-size:19px}
.stepper input.n:focus{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
/* valor em R$ */
.money{background:var(--surface2);border:0;border-radius:18px;min-height:64px;padding:0 18px}
.money span{font-size:20px}
.money input{font-size:30px;letter-spacing:-.02em}
.money:focus-within{outline:2.5px solid var(--accent);outline-offset:0;background:var(--surface)}
.money.sm{min-height:52px;border:1.5px solid var(--line-strong);background:var(--surface)} .money.sm input{font-size:18px}
.field input,.field select,.field textarea{border-radius:14px;min-height:52px}
#f-pin{font-size:28px;letter-spacing:.5em;text-align:center;min-height:64px;padding-left:calc(14px + .5em)}
#f-pin::placeholder{font-size:16px;letter-spacing:0}
/* escolhas da tela inicial */
.choice{border-radius:20px;min-height:80px;padding:16px 18px;gap:16px}
.choice .t{font-size:17px;letter-spacing:-.01em}
.ico{width:48px;height:48px;border-radius:16px}
.choice .go{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo-full{width:118px;height:118px}
.center .ico{border-radius:50%}
.who{font-size:28px;letter-spacing:-.02em}
/* barra de abas flutuante */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--card-border);border-radius:24px;box-shadow:0 10px 30px rgba(20,35,44,.16);background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.tabs-in{gap:4px}
.tab{min-height:58px;border-radius:18px;gap:4px;font-size:12px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
main{padding-bottom:140px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:16px}
/* listas, tabelas, avisos */
.lrow{padding:14px 18px}
.card.flush>.head{padding:18px 18px 10px}
table.t th{background:transparent;border-bottom:1px solid var(--line)}
.scroll table.t th:first-child{background:var(--surface)}
.alert,.info,.soft,.note{border-radius:16px}
.chip{padding:4px 11px}
.netbar{border-radius:18px}
.sheet{border-radius:28px 28px 0 0;padding:26px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.sheet{border-radius:28px}}
.toptabs .tt{border-radius:14px}

.kpis.loose{box-shadow:none;border-radius:0}
.card .choice{box-shadow:none;background:var(--surface2);border-color:transparent}
.card .choice .ico{background:var(--surface);}
.card .choice .go{background:var(--surface)}
@media (hover:hover) and (pointer:fine){.card .choice:hover{border-color:var(--accent)}}

/* ---------- telas de entrada (v5) ---------- */
.band.welcome{padding-block:18px 30px;border-radius:0 0 32px 32px}
.band.welcome + main .main-in{margin-top:20px}
.band.welcome .band-in{align-items:flex-start;text-align:left}
.band.welcome h1{font-size:30px;letter-spacing:-.03em;line-height:1.1}
.band.welcome .logo-full{width:76px;height:76px;align-self:flex-start}
.band.home{padding-block:16px 36px}
.band.home .row{width:100%;align-items:flex-start}
.band.home .hello{margin-top:18px;font-size:15px;font-weight:700;color:var(--header-muted)}
.band.flow h1{margin-top:14px;font-size:28px}
.band.flow .row{width:100%}
.band.flow .mark{margin-left:auto}
.linkbtn.round{border-radius:50%;padding:0;width:44px;height:44px}
.steps-dots{display:flex;align-items:center;gap:5px;margin-left:6px}
.steps-dots i{width:22px;height:5px;border-radius:999px;background:rgba(255,255,255,.25)}
.steps-dots i.on{background:#fff}
.steps-dots em{font-style:normal;font-size:12px;font-weight:700;color:var(--header-muted);margin-left:6px}
h2.sect{font-size:15px;color:var(--muted);font-weight:700;margin:4px 4px -2px}
.role-main{display:flex;align-items:center;gap:16px;width:100%;text-align:left;min-height:104px;padding:20px;border-radius:24px;border:0;cursor:pointer;box-shadow:var(--shadow-md);transition:transform 120ms var(--ease-out)}
.role-main .ico{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.14);color:#fff}
.role-main .t{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff}
.role-main .small{color:rgba(255,255,255,.78);font-size:14px}
.role-main .go{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--feature);display:inline-flex;align-items:center;justify-content:center;flex:none}
.roles2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.roles2>:only-child{grid-column:1/-1}
.role-tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;min-height:150px;border-radius:24px;border:1px solid var(--card-border);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform 120ms var(--ease-out)}
.role-tile .ico{margin-bottom:auto}
.role-tile .t{font-size:16px;font-weight:800;letter-spacing:-.01em}
.role-main:active,.role-tile:active,.lchoice:active{transform:scale(.98)}
details.demo{box-shadow:none;background:transparent;border:1.5px dashed var(--line-strong)}
.lgroup{box-shadow:var(--shadow-md)}
.lchoice{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 18px;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.lchoice:first-child{border-top:0}
.lchoice>svg{color:var(--muted);margin-left:auto;flex:none}
.lchoice .t{font-size:17px;font-weight:800}
.lchoice .ico{width:44px;height:44px;border-radius:14px}
@media (hover:hover) and (pointer:fine){.lchoice:hover{background:var(--surface2)}.role-tile:hover{border-color:var(--accent)}}
.pinbox{align-items:stretch}
.lockico{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;align-self:center}
.pinbox>.small{text-align:center}
.confirm .avatar{width:84px;height:84px;border-radius:50%;background:var(--feature);color:#fff;font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(36,73,91,.3)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-strong);box-shadow:none}

/* caixa de seleção da loja (gerência) */
.storesel{padding:14px 16px}
.selwrap{position:relative;display:flex;align-items:center}
.selwrap .ico{position:absolute;left:8px;width:36px;height:36px;border-radius:12px;pointer-events:none}
.selwrap .caret{position:absolute;right:14px;color:var(--muted);pointer-events:none;display:flex}
.field .selwrap select{appearance:none;-webkit-appearance:none;min-height:56px;padding:0 44px 0 56px;font-size:18px;font-weight:800;border-radius:16px;background:var(--surface2);border:1.5px solid var(--line-strong);cursor:pointer}

/* indicadores por loja */
.indrow{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.indname{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:none;border:0;padding:0;text-align:left;color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.ind{display:flex;flex-direction:column;gap:1px;min-width:0}
.ind strong{font-size:17px;font-weight:800;letter-spacing:-.01em}
@media (max-width:719px){.indrow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:8px}.indname{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px}}
.dim{opacity:.45}
.checkrow{display:flex;align-items:center;gap:10px;font-weight:700;min-height:44px;cursor:pointer}
.checkrow input{width:22px;height:22px;accent-color:var(--accent)}
button.lrow>.btn{pointer-events:none}
</style>

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => (n < 10 ? '0' : '') + n;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function money(n){ return 'R$ ' + (Math.round((n || 0) * 100) / 100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function brl(n){ return 'R$ ' + Math.round(n || 0).toLocaleString('pt-BR'); }
function num(n){ return Math.round(n || 0).toLocaleString('pt-BR'); }
function dec1(n){ return (Math.round((n || 0) * 10) / 10).toFixed(1).replace('.', ','); }
function pct(n){ return n == null || !isFinite(n) ? '–' : Math.round(n) + '%'; }
function short(n){ if (n >= 1e6) return 'R$ ' + (n / 1e6).toFixed(2).replace('.', ',') + ' mi'; if (n >= 1e4) return 'R$ ' + Math.round(n / 1000) + ' mil'; return brl(n); }

/* ---------- máscaras: o número entra da direita (1 → 0,01 → 0,12 → 1,23) ---------- */
const digits = s => String(s || '').replace(/\D/g, '');
function fmtMoneyInput(cents){ return ((cents || 0) / 100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function readMoney(s){ return (parseInt(digits(s), 10) || 0) / 100; }
function readDec1(s){ return (parseInt(digits(s), 10) || 0) / 10; }
function readInt(s){ return parseInt(digits(s), 10) || 0; }
function applyMask(el){
  const m = el.dataset.mask; let d = digits(el.value).replace(/^0+(?=\d)/, '');
  if (m === 'money') el.value = fmtMoneyInput(parseInt(d.slice(0, 13) || '0', 10));
  else if (m === 'dec1') el.value = ((parseInt(d.slice(0, 4) || '0', 10)) / 10).toFixed(1).replace('.', ',');
  else if (m === 'int') el.value = d === '' ? '' : String(parseInt(d.slice(0, 6), 10));
  else if (m === 'pin') el.value = d.slice(0, 8);
  try { const L = el.value.length; el.setSelectionRange(L, L); } catch (e) {}
}
const NUMKEY = 'type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"';
function moneyField(k, v, label, hint){
  return '<label class="field" for="f-' + k + '">' + label + '<span class="money sm"><span>R$</span><input id="f-' + k + '" ' + NUMKEY + ' data-mask="money" data-k="' + k + '" value="' + fmtMoneyInput(Math.round((v || 0) * 100)) + '"></span>' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
}
function intField(k, v, label, hint){ return '<label class="field" for="f-' + k + '">' + label + '<input id="f-' + k + '" ' + NUMKEY + ' data-mask="int" data-k="' + k + '" value="' + (v == null ? '' : Math.round(v)) + '">' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>'; }
function dec1Field(k, v, label, hint){ return '<label class="field" for="f-' + k + '">' + label + '<input id="f-' + k + '" ' + NUMKEY + ' data-mask="dec1" data-k="' + k + '" value="' + dec1(v || 0) + '">' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>'; }
function pinField(k, label, hint, visible, v){ return '<label class="field" for="f-' + k + '">' + label + '<input id="f-' + k + '" type="' + (visible ? 'text' : 'password') + '" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-mask="pin" data-k="' + k + '" value="' + esc(v || '') + '" placeholder="4 a 8 números">' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>'; }
function textField(k, v, label, ph){ return '<label class="field" for="f-' + k + '">' + label + '<input id="f-' + k + '" type="text" autocomplete="off" maxlength="40" data-k="' + k + '" value="' + esc(v || '') + '" placeholder="' + esc(ph || '') + '"></label>'; }

/* ---------- datas ---------- */
function P(s){ const a = s.split('-').map(Number); return {y:a[0], m:a[1], d:a[2]}; }
const mkOf = s => s.slice(0, 7);
function daysIn(mk){ const a = mk.split('-').map(Number); return new Date(a[0], a[1], 0).getDate(); }
function addDays(s, n){ const p = P(s); return new Date(Date.UTC(p.y, p.m - 1, p.d + n)).toISOString().slice(0, 10); }
function addMonths(mk, n){ const a = mk.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1 + n, 1)).toISOString().slice(0, 7); }
const dateOf = (mk, d) => mk + '-' + pad(d);
function wd(s){ const p = P(s); return new Date(p.y, p.m - 1, p.d).getDay(); }
function dlabel(s){ const p = P(s); return WD[wd(s)] + ' ' + pad(p.d) + '/' + pad(p.m); }
function dlow(s){ return dlong(s).toLowerCase(); }
function dlong(s){ const p = P(s); return WDL[wd(s)] + ', ' + p.d + ' de ' + MESES[p.m - 1]; }
function mlabel(mk){ const a = mk.split('-').map(Number); const n = MESES[a[1] - 1]; return n[0].toUpperCase() + n.slice(1) + '/' + a[0]; }
function ctx(mk){ const D = daysIn(mk), tk = mkOf(TODAY), td = P(TODAY).d; return {mk:mk, D:D, t: mk === tk ? td : mk < tk ? D : 0}; }

function tone(p, ref){ if (p == null || !isFinite(p)) return 'c-muted'; if (!ref || p >= ref) return 'c-good'; return p >= ref * 0.85 ? 'c-mid' : 'c-warn'; }
function bar(p, pace, thin){ const w = Math.max(0, Math.min(100, p || 0)), t = tone(p || 0, pace != null ? pace : 100); return '<div class="bar' + (thin ? ' thin' : '') + '"><i class="' + (t === 'c-good' ? '' : t === 'c-mid' ? 'mid' : 'warn') + '" style="width:' + w + '%"></i>' + (pace != null ? '<b style="left:' + Math.min(100, pace) + '%"></b>' : '') + '</div>'; }
function kpi(label, v, meta, ok){ return '<div class="kpi"><span class="label">' + label + '</span><span class="v">' + (v == null ? '–' : v) + '</span><span class="small">meta ' + meta + '</span>' + (v == null ? '<span class="small">sem vendas</span>' : ok ? '<span class="tag-ok">● Na meta</span>' : '<span class="tag-bad">▲ Abaixo</span>') + '</div>'; }
function kpiRow(m, sid){ const M = metasOf(sid); return '<div class="kpis">' + kpi('P.A.', m.pa == null ? null : dec1(m.pa), dec1(M.pa), m.pa >= M.pa) + kpi('Ticket médio', m.tm == null ? null : brl(m.tm), brl(M.tm), m.tm >= M.tm) + kpi('Conversão', m.conv == null ? null : pct(m.conv), M.conv + '%', m.conv >= M.conv) + '</div>'; }
function prodCard(m, sid, pid, mk, title){
  const pl = prodLines(m, sid, pid, mk); if (!pl.lines.length) return '';
  return '<section class="card"><div class="stack"><h2>' + title + '</h2><span class="small">Sobre ' + pl.R + ' ' + esc(pl.refName) + ' vendidos no mês · meta de 100% em cada uma</span></div>' +
    pl.lines.map(r => '<div class="prod"><span>' + esc(r.label) + '</span>' + bar(r.v, null, true) + '<span class="p ' + (tone(r.v, 100)) + '">' + pct(r.v) + '</span></div>').join('') + '</section>';
}
function chart(sid, pids, c){
  const vals = []; let max = 1; for (let d = 1; d <= c.D; d++){ const v = sum(sid, pids, 'venda', c.mk, d, d); vals.push(v); if (d <= c.t && v > max) max = v; }
  const zt = c.t ? dezOf(c.t) : 0;
  const bars = vals.map((v, i) => { const d = i + 1; if (d > c.t) return '<i class="future" style="height:10%"></i>'; if (!v) return '<i class="zero" style="height:2px"></i>'; return '<i class="' + (dezOf(d) === zt && c.mk === mkOf(TODAY) ? '' : 'past') + '" style="height:' + Math.max(3, v / max * 100) + '%" title="' + dlabel(dateOf(c.mk, d)) + ': ' + brl(v) + '"></i>'; }).join('');
  return '<section class="card"><div class="row"><h2>Vendas por dia</h2><span class="small">maior dia: ' + brl(max) + '</span></div><div class="chart" role="img" aria-label="Vendas diárias de ' + mlabel(c.mk) + '">' + bars + '</div><div class="row small"><span>dia 1</span><span>dia 10</span><span>dia 20</span><span>dia ' + c.D + '</span></div></section>';
}
function dezCard(C, sid, pids, c, anoant){
  const el = elapsed(sid, pids, c), sold = sum(sid, pids, 'venda', c.mk, 1, c.t), pace = el / c.D * 100;
  const rows = [1, 2, 3].map(z => {
    const r = dezRange(z, c.D), cd = dezCota(C, sid, pids, c.mk, z), s = sum(sid, pids, 'venda', c.mk, r[0], Math.min(r[1], c.t));
    const state = c.t > r[1] ? 'fechada' : c.t >= r[0] ? 'em andamento' : 'prévia';
    if (state === 'prévia') return '<div class="stack"><div class="row"><strong>' + z + 'ª dezena</strong><span class="small">começa ' + dlabel(dateOf(c.mk, r[0])) + '</span></div><span class="small">Cota prevista hoje: ' + brl(cd) + '</span></div>';
    const p = cd > 0 ? s / cd * 100 : 100;
    return '<div class="stack"><div class="row"><strong>' + z + 'ª dezena <span class="small">(' + state + ')</span></strong><span class="' + tone(p, 100) + '" style="font-weight:800">' + pct(p) + '</span></div>' + bar(p, null) + '<span class="small">' + brl(s) + ' de ' + brl(cd) + '</span></div>';
  }).join('');
  const mp = C ? sold / C * 100 : 0, ano = anoant ? anoant * el / c.D : 0;
  return '<section class="card"><h2>Cota</h2>' + rows + '<div class="stack"><div class="row"><strong>Mês</strong><span class="' + tone(mp, pace) + '" style="font-weight:800">' + pct(mp) + '</span></div>' + bar(mp, pace) +
    '<span class="small">' + brl(sold) + ' de ' + brl(C) + ' · a linha marca o ritmo esperado (' + pct(pace) + ')</span></div>' +
    (ano ? '<div class="row" style="background:var(--surface2);border-radius:12px;padding:10px 12px"><span class="label">Comparado ao mesmo período do ano passado</span><strong>' + pct(sold / ano * 100) + '</strong></div>' : '') + '</section>';
}
function monthNav(){ const cur = mkOf(TODAY); return '<div class="mnav"><button class="linkbtn" data-act="month" data-d="-1" aria-label="Mês anterior">' + icon('left', 18) + '</button><strong>' + mlabel(ui.month) + '</strong><button class="linkbtn" data-act="month" data-d="1" aria-label="Próximo mês"' + (ui.month >= (ui.tab === 'config' ? addMonths(cur, 1) : cur) ? ' disabled' : '') + '>' + icon('right', 18) + '</button></div>'; }

}
let EDITOR = null, draft = null;
let DRAFTS = (() => { try { return JSON.parse(localStorage.getItem('rd-rascunhos') || '{}'); } catch (e) { return {}; } })();
function keepDraft(){ if (!EDITOR || !draft) return; DRAFTS[EDITOR.key] = clone(draft); try { localStorage.setItem('rd-rascunhos', JSON.stringify(DRAFTS)); } catch (e) {} }
function dropDraft(key){ delete DRAFTS[key]; try { localStorage.setItem('rd-rascunhos', JSON.stringify(DRAFTS)); } catch (e) {} }
function zeros(){ const o = {}; allFields().forEach(f => { o[f] = 0; }); return o; }
function openDraft(sid, pid, date, mode){ const key = sid + '|' + pid + '|' + date; if (!EDITOR || EDITOR.key !== key){ const e = ENTRIES[key]; draft = zeros(); if (DRAFTS[key]) Object.assign(draft, DRAFTS[key]); else if (e && !e.folga && e.v) Object.keys(e.v).forEach(f => { draft[f] = +e.v[f] || 0; }); EDITOR = {key:key, sid:sid, pid:pid, date:date}; } EDITOR.mode = mode; }

  if (mode === 'retro') banner = '<div class="soft"><strong>Lançamento retroativo · ' + esc(sellerName(sid, pid)) + '</strong><span>' + dlong(date) + '. Depois de salvar, o app abre o próximo dia que ainda não foi lançado.</span></div>';
  if (mode === 'gerencia') banner = '<div class="alert"><strong>Correção pela gerência · uso excepcional</strong><span>' + esc(sellerName(sid, pid)) + ', ' + dlabel(date) + '. A alteração muda resultados já calculados e fica registrada no histórico da planilha.</span></div>';

    c.products.filter(p => !p.archived).map(p => stepLine(p.id, p.name)).join('') + '</details>').join('');

    '<span class="small">Você só digita quantidades. P.A., ticket, conversão e cotas são calculados pelo app. Antes de gravar, o app mostra um resumo para você conferir.</span></section>';

function refreshLive(){

  if (LOAD_ERR){ app.className = ''; app.innerHTML = startBand('Sem conexão') + '<main><div class="main-in"><section class="card hero"><h2>Não foi possível falar com a planilha</h2><span class="small">' + esc(LOAD_ERR) + '</span><span class="small">Confira a internet e tente de novo.</span><button class="btn primary" data-act="retry">Tentar de novo</button></section></div></main>'; return; }
  app.className = SESSION.role === 'gerencia' ? 'wide' : '';
  app.innerHTML = !SESSION.role || !CONFIG ? viewStart() : SESSION.role === 'vendedor' ? viewSeller() : SESSION.role === 'gerente' ? viewGerente() : viewGerencia();
  if (EDITOR && $('#f-venda')) refreshLive();
}

/* ---------- toques e digitação ---------- */
document.addEventListener('click', async ev => {
  if (ev.target.matches('[data-overlay]')){ if (!document.querySelector('#modal input, #modal textarea, #modal select')) closeModal('no'); return; }
  const mb = ev.target.closest('[data-mact]'); if (mb) return closeModal(mb.dataset.mact);
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset;
  switch (a){
    case 'retry': boot(); break;
    case 'role': if (d.role === 'gerencia') go({step:'pin', pickRole:'gerencia'}); else go({step:'store', pickRole:d.role}); break;
    case 'step': go({step:d.step}); break;
    case 'pick-store': go({step:'pin', pickStore:d.store}); break;
    case 'pick-seller': go({step:'confirm', pickSeller:d.pid}); break;
    case 'confirm-seller': SESSION = {role:'vendedor', store:ui.pickStore, seller:ui.pickSeller, token:ui.storeToken}; saveSession(); EDITOR = null; go({step:'home', tab:'lancar'}); toast('Olá, ' + sellerName(SESSION.store, SESSION.seller) + '!'); break;
    case 'login': case 'setup-pin': {
      const pin = ($('#f-pin') || {}).value || '', g = ui.pickRole === 'gerencia', vd = ui.pickRole === 'vendedor';
      if (pin.length < 4) return toast('A senha tem de 4 a 8 números.');
      if (a === 'setup-pin' && pin !== ($('#f-pin2') || {}).value) return toast('As duas senhas não são iguais.');
      try {
        const r = a === 'setup-pin' ? await api('setupGerencia', {pin:pin}) : await api('login', {role:g ? 'gerencia' : vd ? 'vendedor' : 'gerente', store:ui.pickStore, pin:pin});
        if (!r.ok){ if (r.needSetup){ HAS_GPIN = false; render(); return; } const f = $('#f-pin'); if (f){ f.value = ''; f.focus(); } return toast(r.error || 'Senha incorreta.'); }
        if (vd){ ui.storeToken = r.token; go({step:'seller'}); return; }
        SESSION = {role:g ? 'gerencia' : 'gerente', store:g ? null : ui.pickStore, token:r.token}; saveSession();
        if (g && !CONFIG){ await api('saveConfig', {config:newConfig(false)}); await refresh(); toast('Lojas iniciais cadastradas. Confira tudo em Configurar.'); }
        if (g) loadPins();
        go({step:'home', tab:g ? 'rede' : 'loja', month:mkOf(TODAY)});
      } catch (e) { toast('Sem conexão com a planilha.'); }
      break; }
    case 'logout':
      if (SESSION.role === 'vendedor'){
        const rr = await modal({title:'Sair ou trocar de vendedor?', body:'<p>Se outra pessoa da mesma loja vai lançar neste aparelho, use <strong>Trocar de vendedor</strong>: não precisa digitar a senha da loja de novo.</p>' + (OUTBOX.length ? '<div class="soft">Há lançamentos guardados esperando internet. Eles continuam guardados e serão enviados.</div>' : ''),
          actions:[{label:'Cancelar', act:'no'}, {label:'Sair da loja', act:'out'}, {label:'Trocar de vendedor', act:'switch', primary:true}]});
        if (rr.act === 'no') return;
        const st = SESSION.store, tk = SESSION.token; SESSION = {}; saveSession(); EDITOR = null;
        if (rr.act === 'switch'){ go({step:'seller', pickRole:'vendedor', pickStore:st, storeToken:tk, tab:null, editDate:null, fix:null}); return; }
        go({step:'home', tab:null, editDate:null, fix:null}); return;
      }
      if (!(await ask('Sair?', SESSION.role === 'vendedor' ? '<p>Na próxima vez, você escolhe a loja e o seu nome de novo.</p>' : '<p>Para entrar de novo, vai precisar da senha.</p>', 'Sim, sair'))) return;
      SESSION = {}; saveSession(); EDITOR = null; PINS = null; go({step:'home', tab:null, editDate:null, fix:null}); break;
    case 'refresh': try { await refresh(); await flushOutbox(); render(); toast('Dados atualizados'); } catch (e) { render(); toast(e.message || 'Sem conexão com a planilha.'); } break;
    case 'flush': try { await refresh(); } catch (e) {} await flushOutbox(); render(); if (OFFLINE) toast('Ainda sem internet. Os lançamentos continuam guardados.'); break;
    case 'demo-net': DEMO_NET_DOWN = !DEMO_NET_DOWN; if (!DEMO_NET_DOWN){ OFFLINE = false; await flushOutbox(); } render(); toast(DEMO_NET_DOWN ? 'Internet desligada (simulação)' : 'Internet ligada de novo (simulação)'); break;
    case 'tab': EDITOR = null; go({tab:d.tab, editDate:null, fix:null}); if (d.tab === 'config' && SESSION.role === 'gerencia' && !PINS){ await loadPins(); render(); } break;
    case 'inc': case 'dec': { const f = d.f; draft[f] = Math.max(0, (draft[f] || 0) + (a === 'inc' ? 1 : -1)); const i = document.querySelector('input.n[data-f="' + f + '"]'); if (i) i.value = draft[f]; keepDraft(); refreshLive(); break; }
    case 'save': saveDraft(false); break;
    case 'folga': saveDraft(true); break;
    case 'edit-day': EDITOR = null; go({editDate:d.date}); break;
    case 'hist-back': EDITOR = null; go({editDate:null}); break;
    case 'ask-fix': askFix(SESSION.store, SESSION.seller, d.date); break;
    case 'month': { const nm = addMonths(ui.month, +d.d); if (nm > (ui.tab === 'config' ? addMonths(mkOf(TODAY), 1) : mkOf(TODAY))) return; ui.month = nm; if (!LOADED.has(nm)){ try { await loadData([nm]); } catch (e) { toast('Sem conexão com a planilha.'); } } render(); break; }
    case 'open-store': go({tab:'lojas', store:d.store, fix:null}); break;
    case 'pick-ger-store': EDITOR = null; go({store:d.store, fix:null}); break;
    case 'fix-pick': EDITOR = null; ui.fix = {sid:ui.store, pid:$('#fx-p').value, date:$('#fx-d').value}; render(); setTimeout(() => { const f = $('#fix-box'); if (f) f.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }, 50); break;
    case 'fix-open': {
      if (!(await ask('Abrir correção?', '<p>Você vai alterar o lançamento de <strong>' + esc(sellerName(d.store, d.pid)) + '</strong> em <strong>' + dlow(d.date) + '</strong>.</p><p class="small">Use só quando o vendedor não puder corrigir. Tudo fica registrado no histórico.</p>', 'Sim, abrir'))) return;
      EDITOR = null; const mk = mkOf(d.date); if (!LOADED.has(mk)) await loadData([mk]); ui.month = mk; ui.fix = {sid:d.store, pid:d.pid, date:d.date}; ui.tab = 'lojas'; ui.store = d.store; render(); setTimeout(() => { const f = $('#fix-box'); if (f) f.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }, 50); break; }
    case 'fix-close': EDITOR = null; go({fix:null}); break;
    case 'req-done': if (await ask('Marcar como resolvido?', '<p>O pedido sai da lista de atenção. Faça isso depois de corrigir o lançamento.</p>', 'Sim, resolvido')) run(() => api('resolveRequest', {id:d.id}), 'Pedido resolvido'); break;
    case 'sub': go({sub:d.sub}); if (d.sub === 'lojas' && !PINS){ await loadPins(); render(); } break;
    case 'month-edit': monthEdit(); break;
    case 'month-copy': monthCopy(); break;
    case 'seller-edit': sellerEdit(d.pid); break;
    case 'seller-new': sellerNew(); break;
    case 'store-new': if (!PINS) await loadPins(); storeEditOrNew(null); break;
    case 'store-edit': if (!PINS) await loadPins(); storeEditOrNew(d.store); break;
    case 'store-restore': if (await ask('Reativar loja?', '<p>' + esc(store(d.store).name) + ' volta para os painéis.</p>', 'Sim, reativar')) saveCfg(cfg => cfg.stores.forEach(s => { if (s.id === d.store) s.archived = false; }), 'Loja reativada'); break;
    case 'gpin-edit': gpinEdit(); break;
    case 'prod-new': prodEditOrNew(null, d.cat); break;
    case 'prod-edit': prodEditOrNew(d.pid); break;
    case 'prod-restore': if (await ask('Reativar produto?', '<p>Ele volta para a tela de lançamento.</p>', 'Sim, reativar')) saveCfg(cfg => cfg.categories.forEach(c => c.products.forEach(x => { if (x.id === d.pid) x.archived = false; })), 'Produto reativado'); break;
    case 'cat-new': catEditOrNew(null); break;
    case 'cat-edit': catEditOrNew(d.cat); break;
    case 'metas-save': metasSave(); break;
    case 'meta-store': metaStoreEdit(d.store); break;
    case 'go-metas': EDITOR = null; go({tab:'config', sub:'metas'}); break;
    case 'retro-day': EDITOR = null; ui.retro = Object.assign({}, ui.retro, {date:d.date}); render(); window.scrollTo(0, 0); break;
    case 'retro-back': EDITOR = null; ui.retro = Object.assign({}, ui.retro, {date:null}); render(); break;
    case 'retro-cfg': retroCfgSave(d.on === '1'); break;
    case 'install-help': installHelp(); break;
    case 'demo-day': await api('demoToday', {today:addDays(TODAY, +d.d)}); EDITOR = null; await refresh(); render(); break;
    case 'demo-reset': if (await ask('Apagar os testes?', '<p>Tudo o que foi lançado e configurado nesta demonstração some, e os dados de setembro voltam.</p>', 'Sim, apagar', true)){ await api('demoReset', {}); SESSION = {}; saveSession(); EDITOR = null; ENTRIES = {}; LOADED = new Set(); await refresh(); go({step:'home'}); toast('Demonstração reiniciada'); } break;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && MODAL) return closeModal('no');
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-act]')){ ev.preventDefault(); ev.target.click(); }
  if (ev.key === 'Enter' && ev.target.id === 'f-pin' && !MODAL){ const btn = document.querySelector('[data-act="login"],[data-act="setup-pin"]'); if (btn) btn.click(); }
});
/* valores em R$ e decimais: o número sempre entra pela direita, onde quer que o dedo toque */
document.addEventListener('beforeinput', ev => {
  const el = ev.target; if (!el.dataset || (el.dataset.mask !== 'money' && el.dataset.mask !== 'dec1')) return;
  const t = ev.inputType || ''; let d = digits(el.value).replace(/^0+/, '');
  if (t === 'insertText' && ev.data != null){ const add = digits(ev.data); ev.preventDefault(); if (!add) return; d += add; }
  else if (t.indexOf('delete') === 0){ ev.preventDefault(); d = d.slice(0, -1); }
  else return;
  el.value = d; applyMask(el); el.dispatchEvent(new Event('input', {bubbles:true}));
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'm-padrao'){ const o = $('#m-own'); if (o) o.classList.toggle('dim', ev.target.checked); return; }
  const rs = ev.target.closest('select[data-change="retro-mk"], select[data-change="retro-pid"]');
  if (rs){ EDITOR = null; ui.retro = Object.assign({}, ui.retro, rs.id === 'retro-mk' ? {mk:rs.value, date:null} : {pid:rs.value, date:null}); render(); return; }
  const el = ev.target.closest('select[data-change="pick-ger-store"]'); if (!el) return;
  EDITOR = null; go({store:el.value, fix:null});
});
document.addEventListener('input', ev => {
  const el = ev.target; if (el.dataset.mask) applyMask(el);
  if (el.dataset.f && draft){ draft[el.dataset.f] = el.dataset.mask === 'money' ? readMoney(el.value) : readInt(el.value); keepDraft(); refreshLive(); }
});
document.addEventListener('focusin', ev => { const el = ev.target; if (el.dataset && el.dataset.mask && el.dataset.mask !== 'pin'){ setTimeout(() => { try { const L = el.value.length; el.setSelectionRange(L, L); } catch (e) {} }, 0); } });
window.addEventListener('online', async () => { OFFLINE = false; try { await refresh(); } catch (e) {} await flushOutbox(); render(); });
window.addEventListener('offline', () => { OFFLINE = true; render(); });
document.addEventListener('visibilitychange', async () => { if (!document.hidden && SESSION.role && !MODAL && !BUSY){ try { await refresh(); await flushOutbox(); render(); } catch (e) { render(); } } });

/* ---------- início ---------- */
async function boot(){
  LOADING = true; LOAD_ERR = null; render();
  try { await loadData([]); LOADING = false; }
  catch (e) { LOADING = false; if (loadCache()){ OFFLINE = true; setTimeout(() => toast('Sem conexão: mostrando os últimos dados guardados no aparelho.'), 300); } else LOAD_ERR = e.message || 'Erro desconhecido'; }
  if (TODAY){ const lim = addDays(TODAY, -3); let mud = false; Object.keys(DRAFTS).forEach(k => { if (k.split('|')[2] < lim){ delete DRAFTS[k]; mud = true; } }); if (mud) try { localStorage.setItem('rd-rascunhos', JSON.stringify(DRAFTS)); } catch (e) {} }
  if (!OFFLINE && !LOAD_ERR) flushOutbox();
  if (SESSION.role === 'vendedor' && !SESSION.token){ ui = {step:'pin', pickRole:'vendedor', pickStore:SESSION.store}; SESSION = {}; saveSession(); }
  if (SESSION.role === 'gerencia') { ui.month = mkOf(TODAY || '2026-01-01'); loadPins().then(render); }
  render();
  let seen = null; try { seen = localStorage.getItem('rd-instalar-visto'); } catch (e) {}
  if (!seen && !isStandalone() && !LOAD_ERR) setTimeout(installHelp, 600);
}
if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
